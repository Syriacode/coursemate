[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coursemate"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]
sdk = [
    "claude-agent-sdk>=0.2",
]
notebook = [
    "notebook>=7",
    "matplotlib>=3.8",
]

[tool.setuptools]
packages = ["coursemate"]

[tool.setuptools.package-data]
coursemate = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a real local Ollama model (run with: pytest -m live)",
    "db: needs Postgres + pgvector from docker compose (skipped if it isn't running)",
]
addopts = "-m 'not live'"
filterwarnings = [
    # harmless: newer Starlette prefers httpx2 for TestClient; we use httpx for our own HTTP code
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
