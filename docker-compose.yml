services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: coursemate
      POSTGRES_PASSWORD: coursemate # local development only, not a secret
      POSTGRES_DB: coursemate
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "coursemate", "-d", "coursemate"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
