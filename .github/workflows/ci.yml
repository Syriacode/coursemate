name: CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COURSEMATE_REQUIRE_DB: "1"
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: coursemate
          POSTGRES_PASSWORD: coursemate # local development only, not a secret
          POSTGRES_DB: coursemate
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U coursemate -d coursemate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev,notebook]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: python -m pytest -v

      - name: Smoke test the CLI
        run: |
          python -m coursemate --provider fake ingest notes/sample --reset
          python -m coursemate --provider fake ask "What is the late work policy?" --min-score 0.1

      - name: Smoke test the web API (fake provider)
        # uses the index that the CLI smoke test above just built
        run: |
          python -m coursemate --provider fake serve --min-score 0.1 > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf localhost:8000/api/health > /dev/null && break
            if [ "$i" -eq 30 ]; then echo "server did not start"; cat server.log; exit 1; fi
            sleep 1
          done
          curl -sN -X POST localhost:8000/api/chat \
            -H "Content-Type: application/json" \
            -d '{"question": "What is the late work policy?"}' | tee chat.out
          grep -q "^event: done" chat.out || { cat server.log; exit 1; }

      - name: Retrieval eval runs (fake embedder, plumbing only)
        run: python -m coursemate --provider fake eval-retrieval notes/sample evals/retrieval_golden.jsonl

      - name: Notebook runs top to bottom (fake embedder)
        env:
          COURSEMATE_PROVIDER: fake
          MPLBACKEND: Agg
        run: python -m jupyter nbconvert --to notebook --execute notebooks/retrieval.ipynb --output-dir /tmp

      - name: Smoke test the agent eval (fake model)
        run: python -m coursemate --provider fake eval-agent notes/sample evals/agent_cases.jsonl --min-score 0.1
