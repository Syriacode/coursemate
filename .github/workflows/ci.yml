name: CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COURSEMATE_REQUIRE_DB: "1"
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: coursemate
          POSTGRES_PASSWORD: coursemate # local development only, not a secret
          POSTGRES_DB: coursemate
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U coursemate -d coursemate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: python -m pytest -v

      - name: Smoke test the CLI
        run: |
          python -m coursemate --provider fake ingest notes/sample --reset
          python -m coursemate --provider fake ask "What is the late work policy?" --min-score 0.1
